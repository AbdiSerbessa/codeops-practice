<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency App</title>
    <script src="app.js" defer></script>    
</head>
<body>

    <main class="container">
        <div id="status" class="status-container"></div>
        <form id="convert-form">
            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number"  id="amount" step="any" placeholder="enter amount">
            </div>
            <div class="form-group">
                <label for="currency-select">Target Currency:</label>
                <select name="currency" id="currency-select">
                    <option value="">--select Currency--</option>
                </select>
            </div>
            <button type="button" id="add-watchlist-btn">Add to Watchlist</button>
            <button type="submit">Convert</button>
        </form>
        <div id="result" class="result-container"></div>
        <section class="watchlist-section">
            <h3>Watchlist</h3>
            <ul id="watchlist" class="watchlist-container"></ul>
        </section>
    </main>

</body>
</html>
