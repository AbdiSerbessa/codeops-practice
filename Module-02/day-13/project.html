<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Eatery - Menu Card</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>
    <!-- Single .menu-card component -->
    <article class="menu-card">
      <h3 class="dish-name">Doro Wat</h3>
      <p class="description">Traditional slow-cooked chicken stew prepared with berbere, spicy niter kibbeh, and served with a boiled egg.</p>
      
      <!-- Price (ETB prefix will be added via CSS ::before) -->
      <div class="price">650</div>

      <h4>Ingredients</h4>
      <ul class="ingredients-list">
        <li>Chicken drumsticks</li>
        <li>Berbere spice blend</li>
        <li>Niter Kibbeh (spiced butter)</li>
        <li>Red onions &amp; garlic</li>
        <li>Hard-boiled eggs</li>
        <li>Fresh Injera</li>
      </ul>
    </article>
  </main>

</body>
</html>
