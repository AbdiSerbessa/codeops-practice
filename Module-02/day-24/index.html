<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteDash | Order Food</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="#">
</head>
<body>
  <header class="navbar">
    <h1>Addis<span>Eats</span></h1>
    <div class="cart-pill">🛒 Cart (<span id="cart-count">0</span>)</div>
  </header>

  <div class="app-layout">
    <main>
      <div class="controls">
        <input type="text" id="search-input" placeholder="Search menu..." />
        <div class="categories" id="category-filters">
          <button class="cat-btn active" data-cat="all">All</button>
          <button class="cat-btn" data-cat="Main">Traditional</button>
          <button class="cat-btn" data-cat="Vegetarian">Vegetarian</button>
          <button class="cat-btn" data-cat="Drinks">Drinks</button>
        </div>
      </div>

      <div class="menu-grid" id="menu-grid"></div>
    </main>

    <aside class="cart-section">
      <h2>Your Order</h2>
      <div id="cart-items" class="cart-items"></div>
      
      <div class="summary">
        <div class="total-row">Total: <strong id="cart-total">0 ETB</strong></div>
      </div>

      <form id="checkout-form" class="checkout-form">
        <h3>Delivery Details</h3>
        
        <div class="form-group">
          <input type="text" id="cust-name" placeholder="Full Name" />
          <span class="error" id="err-name"></span>
        </div>

        <div class="form-group">
          <input type="text" id="cust-phone" placeholder="Phone (e.g., 0911223344)" />
          <span class="error" id="err-phone"></span>
        </div>

        <div class="form-group">
          <input type="text" id="cust-address" placeholder="Delivery Address" />
          <span class="error" id="err-address"></span>
        </div>

        <button type="submit" id="checkout-btn" class="submit-btn" disabled>Place Order</button>
      </form>
    </aside>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">
        <h3>Addis<span>Eats</span></h3>
        <p>Fresh local meals, delivered straight to your door.</p>
      </div>
      <div class="footer-links">
        <a href="#">Menu</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 BiteDash. All rights reserved.</p>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
