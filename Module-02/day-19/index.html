<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Market Shopping List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Addis Market Shopping List</h1>

   
    <form id="item-form">
      <input type="text" id="item-input" placeholder="Enter item name..." required>
      <button type="submit">Add Item</button>
    </form>

    
    <p id="item-count">Items remaining: 0</p>

    <ul id="list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
