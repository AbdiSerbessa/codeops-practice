<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Eats | Food Ordering Core</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <h1>Addis<span>Eats</span></h1>
    </div>
    <div class="cart-indicator">
      🛒 Cart (<span id="cart-count">0</span>)
    </div>
  </header>

  <div class="layout-container">
    <main class="main-content">
      <!-- Search & Category Filters -->
      <section class="controls-section">
        <input type="text" id="search-input" placeholder="Search delicious food..." />
        <div class="category-buttons" id="category-buttons">
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="traditional">Traditional</button>
          <button class="filter-btn" data-category="vegan">Vegan</button>
          <button class="filter-btn" data-category="fast-food">Fast Food</button>
          <button class="filter-btn" data-category="drinks">Drinks</button>
        </div>
      </section>

      <!-- Dynamic Menu Item Grid -->
      <section id="menu-grid" class="menu-grid">
        <p class="loading-text">Loading menu options...</p>
      </section>
    </main>

    <!-- Cart Sidebar -->
    <aside class="cart-sidebar">
      <h2>Your Order</h2>
      <div id="cart-items" class="cart-items-container">
        <p class="empty-cart-msg">Your cart is empty.</p>
      </div>
      <div class="cart-summary">
        <div class="total-row">
          <span>Total:</span>
          <strong><span id="cart-total">0</span> ETB</strong>
        </div>
        <button id="checkout-btn" class="checkout-btn" disabled>Proceed to Checkout</button>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
